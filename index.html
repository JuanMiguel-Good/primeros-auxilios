<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reto de rescate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Página clara para que el logo de Good Solutions (azul marino sobre transparente) se vea tal cual. Una columna de 480px pensada para el pulgar. */
  --bg:#FFFFFF;
  --ink:#002242;
  --text:#0F2A44;
  --muted:#586F86;
  --panel:#F2F6FA;
  --panel-2:#E3EBF3;
  --line:#CCD9E6;
  --sel:#E1ECFB;
  --pulse:#E5334F;
  --ok:#0B8F63;
  --ok-bg:#E3F6EE;
  --warn:#B86E00;
  --warn-bg:#FFF2DB;
  --bad:#C93C3C;
  --bad-bg:#FBE8E8;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Figtree",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
.app{min-height:100%;max-width:480px;margin:0 auto;padding:0 16px 48px;display:flex;flex-direction:column}
button{font:inherit;color:inherit}

/* Barra superior */
.hud{position:sticky;top:0;z-index:5;padding:10px 0 8px;background:var(--bg);border-bottom:1px solid var(--line)}
.hud-row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.logo{display:block;height:auto}
.logo.sm{width:104px}
.logo.lg{width:190px}
.hud-right{display:flex;align-items:center;gap:8px}
.pts,.timer{font-family:var(--display);font-weight:800;font-size:21px;line-height:1}
.timer{padding:5px 10px;border-radius:999px;background:var(--panel-2)}
.timer.low{background:var(--bad-bg);color:var(--bad)}
.beats{display:grid;gap:2px;margin-top:6px}
.beat svg{display:block;width:100%;height:24px}
.beat path{fill:none;stroke:var(--line);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.beat.cur path{stroke:var(--ink)}
.beat.ok path{stroke:var(--ok)}
.beat.second path{stroke:var(--warn)}
.beat.fail path,.beat.skip path{stroke:var(--bad)}

/* Tipografía */
.tag{margin:18px 0 0;color:var(--muted);font-size:14px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.title{font-family:var(--display);font-weight:800;font-size:clamp(46px,14vw,64px);line-height:.95;letter-spacing:-.02em;margin:10px 0 14px;color:var(--ink);text-wrap:balance}
.lede{margin:0;color:var(--muted);max-width:36ch}
.q{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.2;margin:8px 0 0;color:var(--ink);text-wrap:balance;outline:none}
.status{margin:6px 0 0;color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums;min-height:1.4em}
.status.bad{color:var(--bad);font-weight:600}
h2{font-family:var(--display);font-size:20px;margin:26px 0 8px;color:var(--ink)}
.hint-msg{margin:12px 0 0;color:var(--muted);font-size:15px;min-height:1.4em}

/* Inicio */
.start{padding-top:22px}
.hero-ecg{display:block;width:100%;height:auto;margin:16px 0 4px}
.hero-ecg path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.hero-ecg .base{stroke:var(--line);stroke-width:3}
.hero-ecg .sweep{stroke:var(--pulse);stroke-width:3.5;stroke-dasharray:16 84;animation:sweep 2.8s linear infinite}
@keyframes sweep{from{stroke-dashoffset:16}to{stroke-dashoffset:-84}}
label,.lab{display:block;margin-top:22px;font-weight:600;font-size:15px;color:var(--muted)}
input[type=text]{width:100%;margin-top:6px;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--text);font:inherit}
.recs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.rec{padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-weight:600;font-size:15px}
.rec small{font-weight:400;color:var(--muted);margin-left:4px}
.rec[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.rec[aria-pressed=true] small{color:#C9D8E8}
.modes{display:grid;gap:12px;margin-top:22px}
.btn{width:100%;min-height:56px;padding:15px 18px;border:0;border-radius:14px;background:var(--ink);color:#fff;font-weight:700;cursor:pointer;text-align:left}
.btn small{display:block;font-weight:400;font-size:15px;opacity:.8}
.btn.clock{background:#fff;color:var(--ink);border:2px solid var(--pulse)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);text-align:center}
.btn.center{text-align:center}
.links{display:flex;justify-content:space-between;gap:12px;margin-top:14px}
.link{background:none;border:0;padding:10px 4px;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:16px}
.note{margin:14px 0 0;color:var(--muted);font-size:15px}
input[type=text]:focus-visible,.btn:focus-visible,.opt:focus-visible,.link:focus-visible,.hot:focus-visible,.rec:focus-visible,.row-btn:focus-visible,.chip-btn:focus-visible,.term:focus-visible,.bucket:focus-visible,.tap:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

/* Escena y figura */
.scene{margin-top:14px;border-radius:16px;overflow:hidden;border:1.5px solid var(--line);background:#0A2036}
.scene.light{background:#EAF1F8}
.scene svg{display:block;width:100%;height:auto;touch-action:manipulation}
.hot{fill:transparent;stroke:none;cursor:pointer;outline:none}
.hot.found{fill:rgba(53,214,160,.25);stroke:#35D6A0;stroke-width:3}
.hot:focus-visible{stroke:#fff;stroke-width:2;stroke-dasharray:4 3}
.ripple{fill:none;stroke:var(--bad);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{from{transform:scale(1);opacity:1}to{transform:scale(3.6);opacity:0}}
.chips{list-style:none;display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:10px 0 0}
.chips li{padding:6px 12px;border-radius:999px;background:var(--ok-bg);color:var(--ok);font-size:14px;font-weight:600}

/* Elegir */
.opts{display:grid;gap:10px;margin-top:18px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;width:100%;min-height:64px;padding:14px;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;cursor:pointer}
.opt .k{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--panel-2);font-family:var(--display);font-weight:800;color:var(--ink)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg);animation:shake .3s}
.opt.good{border-color:var(--ok);background:var(--ok-bg)}
.opt.dim{opacity:.5}
.opt:disabled{cursor:default}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* Marcar varias */
.multi{display:grid;gap:8px;margin-top:16px}
.row-btn{display:flex;gap:12px;align-items:flex-start;width:100%;min-height:56px;padding:12px 14px;text-align:left;border:1.5px solid var(--line);border-radius:14px;background:#fff;cursor:pointer}
.row-btn .box{display:grid;place-items:center;flex:none;width:24px;height:24px;margin-top:1px;border-radius:7px;border:2px solid var(--muted);font-size:15px;line-height:1;color:#fff}
.row-btn[aria-pressed=true]{border-color:var(--ink);background:var(--sel)}
.row-btn[aria-pressed=true] .box{background:var(--ink);border-color:var(--ink)}
.row-btn.good{border-color:var(--ok);background:var(--ok-bg)}
.row-btn.good .box{background:var(--ok);border-color:var(--ok)}
.row-btn.bad{border-color:var(--bad);background:var(--bad-bg);animation:shake .3s}
.row-btn.bad .box{background:var(--bad);border-color:var(--bad)}

/* Ordenar, unir, clasificar, completar */
.slots{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:8px}
.slot{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;min-height:52px;padding:9px 12px;border-radius:12px;border:1.5px dashed var(--line);color:var(--muted)}
.slot.filled{border-style:solid;border-color:var(--ok);background:var(--ok-bg);color:var(--text)}
.slot .n{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--panel-2);font-family:var(--display);font-weight:800;color:var(--ink)}
.pool,.bank{margin-top:14px}
.pool{display:grid;gap:8px}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.chip-btn{min-height:46px;padding:11px 14px;text-align:left;border-radius:12px;border:1.5px solid var(--line);background:#fff;cursor:pointer}
.chip-btn.sel{border-color:var(--ink);background:var(--sel)}
.chip-btn.flash{border-color:var(--bad);background:var(--bad-bg);animation:shake .3s}
.chip-btn:disabled{opacity:.35;cursor:default}
.terms{display:grid;gap:8px;margin-top:16px}
.term{display:block;width:100%;padding:12px 14px;text-align:left;border-radius:12px;border:1.5px dashed var(--line);background:#fff;cursor:pointer}
.term .tt{display:block;font-weight:700;color:var(--ink)}
.term .ta{display:block;margin-top:4px;color:var(--text);font-size:15px}
.term.sel{border-style:solid;border-color:var(--ink);background:var(--sel)}
.term.done{border-style:solid;border-color:var(--ok);background:var(--ok-bg);cursor:default}
.term.flash{border-color:var(--bad);background:var(--bad-bg);animation:shake .3s}
.buckets{display:grid;gap:10px;margin-top:14px}
.bucket{min-height:84px;padding:12px 14px;border-radius:14px;border:2px dashed var(--line);background:var(--panel);cursor:pointer}
.bucket strong{font-family:var(--display);font-size:18px;color:var(--ink)}
.bucket.ready{border-color:var(--ink)}
.bucket.sel{border-style:solid;border-color:var(--ink);background:var(--sel)}
.bucket.flash{border-color:var(--bad);background:var(--bad-bg);animation:shake .3s}
.bucket ul{list-style:none;display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0;padding:0}
.bucket li{padding:4px 10px;border-radius:999px;background:var(--ok-bg);border:1px solid var(--ok);font-size:14px}
.cloze{margin:18px 0 0;font-size:19px;line-height:2.2}
.blank{display:inline-block;min-width:84px;margin:0 3px;padding:0 6px;text-align:center;border-bottom:3px solid var(--ink);font-weight:700}
.blank.active{background:var(--sel)}
.blank.filled{color:var(--ok);border-color:var(--ok)}

/* Mito o verdad */
.vf-card{display:grid;align-items:center;min-height:130px;margin-top:16px;padding:20px 18px;border-radius:16px;background:var(--panel);font-family:var(--display);font-weight:600;font-size:21px;line-height:1.25;color:var(--ink)}
.vf-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.vf-fb{margin-top:12px;padding:14px 16px;border-radius:14px;border-left:5px solid var(--ok);background:var(--ok-bg)}
.vf-fb.no{border-left-color:var(--bad);background:var(--bad-bg)}
.vf-fb strong{display:block;font-family:var(--display);font-size:18px;margin-bottom:2px}
.vf-fb p{margin:0 0 12px}

/* Ritmo */
.tap{display:grid;place-items:center;width:210px;height:210px;margin:18px auto 0;border-radius:50%;border:0;background:var(--ink);color:#fff;font-family:var(--display);font-weight:800;font-size:22px;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.tap:active,.tap.beat{transform:scale(.96);background:var(--pulse)}
.meter{position:relative;height:16px;margin:26px 0 4px;border-radius:999px;background:var(--panel-2)}
.meter .band{position:absolute;top:0;bottom:0;left:33.33%;width:16.67%;background:var(--ok);opacity:.4}
.meter .mk{position:absolute;top:-4px;width:6px;height:24px;margin-left:-3px;border-radius:3px;background:var(--ink)}
.meter-lab{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.tempo-out{margin:12px 0 0;font-weight:600;min-height:1.4em}
.tempo-actions{display:grid;gap:10px;margin-top:12px}

/* Retroalimentación */
.fb{margin-top:16px;padding:16px;border-radius:14px;background:var(--ok-bg);border-left:5px solid var(--ok)}
.fb.second,.fb.hint{background:var(--warn-bg);border-left-color:var(--warn)}
.fb.fail{background:var(--bad-bg);border-left-color:var(--bad)}
.fb strong{display:block;margin-bottom:4px;font-family:var(--display);font-size:19px;color:var(--ink)}
.fb p{margin:0 0 14px}

/* Resultado */
.big{margin:6px 0 0;font-family:var(--display);font-weight:800;font-size:88px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;outline:none}
.big small{margin-left:8px;font-size:24px;color:var(--muted)}
.stats{list-style:none;margin:10px 0 0;padding:0;color:var(--muted)}
.stats b{color:var(--text)}
.compare{margin-top:16px;padding:14px 16px;border-radius:14px;background:var(--panel)}
.compare p{margin:0 0 4px}
.delta{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;font-weight:700;font-size:14px;background:var(--panel-2)}
.delta.up{background:var(--ok-bg);color:var(--ok)}
.delta.down{background:var(--bad-bg);color:var(--bad)}
.blocks{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.blocks li{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:12px;background:var(--panel);font-size:16px}
.review{margin:0;padding-left:20px}
.review li{margin-bottom:8px}
.actions{display:grid;gap:10px;margin-top:24px}

/* Panel de ayuda */
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:end center;background:rgba(0,34,66,.55)}
.sheet{width:min(480px,100%);max-height:88%;overflow:auto;padding:20px 16px 24px;background:#fff;border-radius:20px 20px 0 0}
.sheet h2{margin-top:0}
.sheet ol{padding-left:20px;margin:0 0 18px}
.sheet li{margin-bottom:8px}

/* Ventana emergente, avisos y celebración */
.home-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-weight:700;font-size:14px;cursor:pointer}
.home-btn svg{width:16px;height:16px}
.home-btn:focus-visible,.pop .link:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.modal.center{place-items:center;padding:16px}
.pop{width:min(440px,100%);max-height:92%;overflow:auto;padding:22px 20px 18px;border-radius:20px;border-top:6px solid var(--ok);background:#fff;box-shadow:0 20px 50px rgba(0,34,66,.35);animation:popin .25s ease-out}
.pop.second{border-top-color:var(--warn)}
.pop.fail{border-top-color:var(--bad)}
.pop svg{display:block}
.pop h2{margin:10px 0 2px;font-size:24px}
.pop-line{margin:0;font-weight:700}
.pop-block{margin:10px 0 0;padding:8px 12px;border-radius:10px;background:var(--ok-bg);color:var(--ok);font-weight:700;font-size:15px}
.pop-body{margin:12px 0 0}
.pop-actions{display:grid;gap:8px;margin-top:16px}
.pop-actions .link{text-align:center}
@keyframes popin{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.peekbar{display:grid;gap:10px;margin-top:16px}
.toast{position:fixed;bottom:22px;left:50%;z-index:45;display:flex;align-items:center;gap:10px;width:max-content;max-width:min(440px,92%);padding:12px 16px;border-radius:14px;background:var(--ink);color:#fff;font-weight:700;box-shadow:0 10px 30px rgba(0,34,66,.35);transform:translateX(-50%);animation:toastin .3s ease-out}
.toast svg{flex:none;width:26px;height:26px}
@keyframes toastin{from{transform:translate(-50%,12px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.confetti{position:fixed;inset:0;z-index:40;overflow:hidden;pointer-events:none}
.confetti i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(540deg)}}
.success{margin:8px 0 0;padding:10px 14px;border-radius:12px;background:var(--ok-bg);color:var(--ok);font-weight:700}
.hot.prev{fill:rgba(11,143,99,.12);stroke:none}
.lbl{pointer-events:none}
.stagechip{margin-top:14px;padding:9px 12px;border-radius:12px;font:700 13px var(--body);letter-spacing:.04em;text-align:center;background:#E6F0FA;color:#002242;border:1.5px solid #002242}
.stagechip.s1{background:#FFF1CC;border-color:#8A5A00;color:#5C3B00}
.scene.swap{animation:swapin .45s ease-out}
@keyframes swapin{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.scene.swap{animation:none}}
.lbl text{font:600 11px var(--body);fill:#002242;paint-order:stroke;stroke:#EAF1F8;stroke-width:3px;stroke-linejoin:round}

@media (prefers-reduced-motion:reduce){
  .pop,.toast{animation:none}
  .hero-ecg .sweep{animation:none;stroke-dasharray:none}
  .opt.bad,.row-btn.bad,.chip-btn.flash,.term.flash,.bucket.flash{animation:none}
  .ripple{animation:none;opacity:0}
}
</style>
</head>
<body>
<div class="app">
  <header class="hud" id="hud" hidden>
    <div class="hud-row">
      <span id="hud-logo"></span>
      <span class="hud-right"><span class="pts" id="hud-pts">0 pts</span><span class="timer" id="hud-timer" hidden>0:30</span><button type="button" class="home-btn" id="home-top" aria-label="Ir al inicio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Inicio</button></span>
    </div>
    <div class="beats" id="beats" aria-hidden="true"></div>
  </header>
  <main id="screen"></main>
</div>

<script>

  function actx(){

  function tone(f, start, dur, type, vol){
    var a = actx();
    var t0 = a.currentTime + start;
    var o = a.createOscillator();
    var g = a.createGain();
    o.type = type || "sine";
    o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.16, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }

  function complete(r, c, o){
    if (c.done) return;
    c.done = true;
    S.timing = false;
    var state = o.state || (c.errors === 0 ? "ok" : (c.errors >= 3 ? "fail" : "second"));
    var pts = (o.pts !== undefined) ? o.pts : TABLE[Math.min(c.errors, 3)];
    var bonus = 0;
    if (state === "ok" && S.mode === "clock"){
      bonus = Math.round(30 * Math.max(0, c.left / r.limit));
    }
    pts += bonus;
    S.score += pts;
    S.results[S.idx] = { pts: pts, first: state === "ok", state: state };
    var head, line;
    if (state === "ok"){
      head = "¡Muy bien!";
      line = "Sin errores. +" + pts + " puntos" + (bonus ? " (" + bonus + " por rapidez)" : "");
    } else if (state === "second"){
      head = "¡Completado!";
      line = (c.errors === 0 ? "Con algunos fallos." : "Con " + c.errors + (c.errors === 1 ? " error." : " errores.")) + " +" + pts + " puntos";
    } else {
      head = "Revisa la respuesta";
      line = "Con varios errores. +" + pts + " puntos";
    }
    if (o.title){ line = o.title; }
    var lastOfBlock = S.idx === S.list.length - 1 || S.list[S.idx + 1].b !== r.b;
    c.fb = {
      cls: state === "ok" ? "ok" : (state === "second" ? "second" : "fail"),
      head: head, line: line, body: r.exp,
      block: lastOfBlock ? "Bloque completado: " + BN[r.b] : ""
    };
    renderBeats();
    updateHud();
    if (state !== "fail"){
      sfx(lastOfBlock ? "end" : "fanfare");
      confetti(lastOfBlock ? 46 : 24);
    } else {
      sfx("bad");
    }
    openFb();
  }

  function timeoutReto(){
    var c = S.cur, r = S.list[S.idx];
    if (!c || c.done) return;
    c.done = true;
    S.timing = false;
    try { if (c.mod && c.mod.reveal) c.mod.reveal(); } catch(e){}
    S.results[S.idx] = { pts: 0, first: false, state: "skip" };
    c.fb = { cls: "fail", head: "Se acabó el tiempo", line: "Así era la respuesta.", body: r.exp, block: "" };
    sfx("bad");
    renderBeats();
    updateHud();
    openFb();
  }

  /* ====================== AVISOS Y CELEBRACIÓN ====================== */
  function confetti(n){
    try { if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return; } catch(e){}
    var box = document.createElement("div");
    box.className = "confetti";
    box.setAttribute("aria-hidden", "true");
    var cols = ["#002242", "#E5334F", "#0B8F63", "#F5B04C", "#5BA3E8"];
    for (var i = 0; i < (n || 28); i++){
      var s = document.createElement("i");
      s.style.left = (Math.random() * 100) + "%";
      s.style.background = cols[i % cols.length];
      s.style.animationDelay = (Math.random() * 0.25) + "s";
      s.style.animationDuration = (1.4 + Math.random() * 0.9) + "s";
      s.style.setProperty("--dx", (Math.random() * 90 - 45) + "px");
      box.appendChild(s);
    }
    document.body.appendChild(box);
    setTimeout(function(){ box.remove(); }, 2900);
  }

  /* ====================== DINÁMICAS ====================== */
  function ripple(svg, e){
    try {
      var pt = svg.createSVGPoint();
      pt.x = e.clientX; pt.y = e.clientY;
      var p = pt.matrixTransform(svg.getScreenCTM().inverse());
      var ring = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      ring.setAttribute("cx", p.x); ring.setAttribute("cy", p.y); ring.setAttribute("r", 6);
      ring.setAttribute("class", "ripple");
      svg.appendChild(ring);
      setTimeout(function(){ ring.remove(); }, 650);
    } catch(err){}
  }

  /* Elegir una opción (se usa sola y dentro de la escena) */
  function chooseUI(box, optsIn, cb){
    var opts = shuffle(optsIn.map(function(o){ return { t: o.t, ok: o.ok }; }));
    var tries = 0, locked = [], done = false, msg = "";
    function draw(){
      var h = "";
      opts.forEach(function(o, i){
        var cls = "opt", dis = "";
        if (locked.indexOf(i) !== -1){ cls += " bad"; dis = " disabled"; }
        if (done){
          dis = " disabled";
          if (o.ok) cls += " good";
          else if (locked.indexOf(i) === -1) cls += " dim";
        }
        h += '<button type="button" class="' + cls + '" data-i="' + i + '"' + dis + '><span class="k">' + "ABC".charAt(i) + '</span><span>' + esc(o.t) + '</span></button>';
      });
      box.innerHTML = '<div class="opts">' + h + '</div><p class="hint-msg" aria-live="polite">' + esc(msg) + '</p>';
    }
    draw();
    box.addEventListener("click", function(e){
      var b = e.target.closest ? e.target.closest("button[data-i]") : null;
      if (!b || done) return;
      var i = Number(b.getAttribute("data-i"));
      if (locked.indexOf(i) !== -1) return;
      if (opts[i].ok){
        done = true; msg = "";
        draw();
        cb({ result: "ok", tries: tries });
      } else {
        tries++;
        locked.push(i);
        sfx("bad");
        if (tries >= 2){
          done = true; msg = "";
          draw();
          cb({ result: "fail", tries: tries });
        } else {
          msg = "Esa no es. Te queda un intento.";
          draw();
        }
      }
    });
    return { reveal: function(){ done = true; draw(); } };
  }

  MODS.choose = function(r, c, host, api){
    var ch = chooseUI(host, r.opts, function(res){
      if (res.result === "ok"){
        api.finish({ pts: res.tries === 0 ? 100 : 50, state: res.tries === 0 ? "ok" : "second" });
      } else {
        api.finish({ pts: 0, state: "fail", title: "Esa tampoco. La respuesta correcta quedó marcada." });
      }
    });
    return { reveal: ch.reveal };
  };

  /* Escena: tocar peligros y luego decidir */
  MODS.scene = function(r, c, host, api){
    var found = [], misses = 0, phase = "scene", scenePts = 0, chooser = null;
    host.innerHTML =
      '<div class="scene">' + SCENE_SVG + '</div>' +
      '<ul class="chips" id="chips"></ul><div id="choose"></div>';
    var svg = document.getElementById("sceneSvg");
    function status(){ api.status("Peligros " + found.length + " de 4 · Toques fallidos " + misses); }
    status();
    function foundHazard(i){
      if (found.indexOf(i) !== -1) return;
      found.push(i);
      sfx("found");
      var el = svg.querySelector('[data-h="' + i + '"]');
      if (el) el.classList.add("found");
      var li = document.createElement("li");
      li.textContent = HAZ[i];
      document.getElementById("chips").appendChild(li);
      status();
      if (found.length === 4) decide();
    }
    function decide(){
      phase = "decide";
      scenePts = misses <= 1 ? 50 : 25;
      document.getElementById("q").textContent = r.q2;
      api.status("");
      api.stage("Escena revisada. Ahora decide cómo actuar.");
      chooser = chooseUI(document.getElementById("choose"), r.opts, function(res){
        var dpts = res.result === "ok" ? (res.tries === 0 ? 50 : 25) : 0;
        var total = scenePts + dpts;
        var state = res.result === "fail" ? "fail" : ((res.tries === 0 && misses <= 1) ? "ok" : "second");
        api.finish({ pts: total, state: state, title: res.result === "fail" ? "Esa tampoco. La respuesta correcta quedó marcada. +" + total + " puntos" : undefined });
      });
    }
    svg.addEventListener("click", function(e){
      if (c.done || phase !== "scene") return;
      var h = e.target.closest ? e.target.closest("[data-h]") : null;
      if (h) foundHazard(Number(h.getAttribute("data-h")));
      else { misses++; sfx("bad"); status(); ripple(svg, e); }
    });
    svg.addEventListener("keydown", function(e){
      if (c.done || phase !== "scene") return;
      if ((e.key === "Enter" || e.key === " ") && e.target.getAttribute && e.target.getAttribute("data-h") !== null){
        e.preventDefault();
        foundHazard(Number(e.target.getAttribute("data-h")));
      }
    });
    return {
      reveal: function(){
        [0, 1, 2, 3].forEach(function(i){
          var el = svg.querySelector('[data-h="' + i + '"]');
          if (el) el.classList.add("found");
        });
        if (chooser) chooser.reveal();
      }
    };
  };

  /* Marcar varias opciones */
  MODS.multi = function(r, c, host, api){
    var items = shuffle(r.items.map(function(x){ return { t: x.t, ok: x.ok, sel: false, mark: "" }; }));
    var need = 0;
    items.forEach(function(x){ if (x.ok) need++; });
    host.innerHTML = '<div class="multi" id="ml"></div><p class="hint-msg" id="mh" aria-live="polite"></p><button type="button" class="btn center" id="mcheck">Comprobar</button>';
    var list = host.querySelector("#ml"), hint = host.querySelector("#mh"), btn = host.querySelector("#mcheck");
    function draw(){
      list.innerHTML = items.map(function(x, i){
        return '<button type="button" class="row-btn ' + x.mark + '" data-i="' + i + '" aria-pressed="' + (x.sel ? "true" : "false") + '"><span class="box">' + (x.sel ? "✓" : "") + '</span><span>' + esc(x.t) + '</span></button>';
      }).join("");
    }
    api.status("Marca " + need + " opciones");
    draw();
    list.addEventListener("click", function(e){
      var b = e.target.closest("button");
      if (!b || c.done) return;
      var x = items[Number(b.getAttribute("data-i"))];
      x.sel = !x.sel;
      items.forEach(function(y){ y.mark = ""; });
      draw();
    });
    function reveal(){
      items.forEach(function(x){ x.sel = x.ok; x.mark = x.ok ? "good" : ""; });
      draw();
      btn.hidden = true;
    }
    btn.addEventListener("click", function(){
      if (c.done) return;
      var wrongSel = 0, missing = 0, any = false;
      items.forEach(function(x){
        if (x.sel) any = true;
        if (x.sel && !x.ok) wrongSel++;
        if (!x.sel && x.ok) missing++;
      });
      if (!any){ hint.textContent = "Marca al menos una opción."; return; }
      if (!wrongSel && !missing){
        items.forEach(function(x){ if (x.sel) x.mark = "good"; });
        draw(); btn.hidden = true; hint.textContent = "";
        api.finish();
        return;
      }
      api.err();
      items.forEach(function(x){ x.mark = (x.sel && !x.ok) ? "bad" : ""; });
      draw();
      if (c.errors >= 3){ reveal(); hint.textContent = ""; api.finish(); return; }
      hint.textContent = "Marcaste " + wrongSel + " que no corresponden y te faltan " + missing + ". Corrige y vuelve a comprobar.";
    });
    return { reveal: reveal };
  };

  /* Ordenar pasos */
  MODS.order = function(r, c, host, api){
    var n = r.steps.length;
    var pool = shuffle(r.steps.map(function(t, i){ return { t: t, i: i }; }));
    var placed = 0;
    function draw(flashI){
      var sl = "";
      for (var k = 0; k < n; k++){
        sl += k < placed
          ? '<li class="slot filled"><span class="n">' + (k + 1) + '</span><span>' + esc(r.steps[k]) + '</span></li>'
          : '<li class="slot"><span class="n">' + (k + 1) + '</span><span>Paso ' + (k + 1) + '</span></li>';
      }
      var pb = pool.filter(function(p){ return p.i >= placed; }).map(function(p){
        return '<button type="button" class="chip-btn' + (flashI === p.i ? " flash" : "") + '" data-i="' + p.i + '">' + esc(p.t) + '</button>';
      }).join("");
      host.innerHTML = '<ol class="slots">' + sl + '</ol><p class="hint-msg">Toca el paso que sigue.</p><div class="pool">' + pb + '</div>';
    }
    api.status("0 de " + n + " pasos");
    draw();
    host.addEventListener("click", function(e){
      var b = e.target.closest(".chip-btn");
      if (!b || c.done) return;
      var i = Number(b.getAttribute("data-i"));
      if (i === placed){
        placed++;
        sfx("found");
        api.status(placed + " de " + n + " pasos");
        draw();
        if (placed === n) api.finish();
      } else {
        api.err();
        draw(i);
      }
    });
    return { reveal: function(){ placed = n; draw(); } };
  };

  /* Unir parejas */
  MODS.match = function(r, c, host, api){
    var P = r.pairs, n = P.length;
    var done = {}, doneCount = 0, sel = null, flash = null;
    var ans = shuffle(P.map(function(p, i){ return { i: i, t: p.b }; }));
    function draw(){
      var th = P.map(function(p, i){
        var cls = "term" + (done[i] ? " done" : "") + ((sel && sel.s === "t" && sel.i === i) ? " sel" : "") + ((flash && flash.t === i) ? " flash" : "");
        return '<button type="button" class="' + cls + '" data-t="' + i + '"' + (done[i] ? " disabled" : "") + '><span class="tt">' + esc(p.a) + '</span>' + (done[i] ? '<span class="ta">' + esc(p.b) + '</span>' : "") + '</button>';
      }).join("");
      var ah = ans.filter(function(a){ return !done[a.i]; }).map(function(a){
        var cls = "chip-btn" + ((sel && sel.s === "a" && sel.i === a.i) ? " sel" : "") + ((flash && flash.a === a.i) ? " flash" : "");
        return '<button type="button" class="' + cls + '" data-a="' + a.i + '">' + esc(a.t) + '</button>';
      }).join("");
      host.innerHTML = '<div class="terms">' + th + '</div><p class="hint-msg">Toca un elemento de arriba y luego su pareja de abajo.</p><div class="pool">' + ah + '</div>';
    }
    api.status("0 de " + n + " parejas");
    draw();
    host.addEventListener("click", function(e){
      if (c.done) return;
      var t = e.target.closest("[data-t]"), a = e.target.closest("[data-a]");
      if (!t && !a) return;
      var side = t ? "t" : "a";
      var idx = Number((t || a).getAttribute(t ? "data-t" : "data-a"));
      if (sel && sel.s !== side){
        var ti = side === "t" ? idx : sel.i, ai = side === "a" ? idx : sel.i;
        sel = null;
        if (ti === ai){
          done[ti] = true; doneCount++;
          sfx("found");
          api.status(doneCount + " de " + n + " parejas");
          draw();
          if (doneCount === n) api.finish();
        } else {
          api.err();
          flash = { t: ti, a: ai };
          draw();
          flash = null;
        }
      } else {
        sel = { s: side, i: idx };
        draw();
      }
    });
    return { reveal: function(){ for (var i = 0; i < n; i++) done[i] = true; draw(); } };
  };

  /* Clasificar en grupos */
  MODS.sort = function(r, c, host, api){
    var B = r.buckets;
    var cards = shuffle(r.cards.map(function(x, i){ return { i: i, t: x.t, b: x.b, done: false }; }));
    var left = cards.length, total = cards.length, sel = null, flash = null;
    function draw(){
      var bank = cards.filter(function(k){ return !k.done; }).map(function(k){
        return '<button type="button" class="chip-btn' + ((sel && sel.s === "c" && sel.i === k.i) ? " sel" : "") + ((flash && flash.c === k.i) ? " flash" : "") + '" data-c="' + k.i + '">' + esc(k.t) + '</button>';
      }).join("");
      var bk = B.map(function(name, j){
        var inside = cards.filter(function(k){ return k.done && k.b === j; }).map(function(k){ return "<li>" + esc(k.t) + "</li>"; }).join("");
        var ready = sel && sel.s === "c";
        var armed = sel && sel.s === "b" && sel.i === j;
        return '<div class="bucket' + (ready ? " ready" : "") + (armed ? " sel" : "") + ((flash && flash.b === j) ? " flash" : "") + '" role="button" tabindex="0" data-b="' + j + '"><strong>' + esc(name) + '</strong><ul>' + inside + '</ul></div>';
      }).join("");
      host.innerHTML = '<div class="bank">' + bank + '</div><p class="hint-msg">Toca una tarjeta y luego el grupo al que pertenece.</p><div class="buckets">' + bk + '</div>';
    }
    function attempt(ci, bj){
      var k = cards.filter(function(x){ return x.i === ci; })[0];
      sel = null;
      if (k.b === bj){
        k.done = true; left--;
        sfx("found");
        api.status((total - left) + " de " + total + " tarjetas");
        draw();
        if (left === 0) api.finish();
      } else {
        api.err();
        flash = { c: ci, b: bj };
        draw();
        flash = null;
      }
    }
    function press(e){
      if (c.done) return;
      var k = e.target.closest("[data-c]"), b = e.target.closest("[data-b]");
      if (!k && !b) return;
      if (k){
        var ci = Number(k.getAttribute("data-c"));
        if (sel && sel.s === "b") attempt(ci, sel.i);
        else { sel = { s: "c", i: ci }; draw(); }
      } else {
        var bj = Number(b.getAttribute("data-b"));
        if (sel && sel.s === "c") attempt(sel.i, bj);
        else { sel = { s: "b", i: bj }; draw(); }
      }
    }
    api.status("0 de " + total + " tarjetas");
    draw();
    host.addEventListener("click", press);
    host.addEventListener("keydown", function(e){
      if ((e.key === "Enter" || e.key === " ") && e.target.getAttribute && e.target.getAttribute("data-b") !== null){
        e.preventDefault();
        press(e);
      }
    });
    return { reveal: function(){ cards.forEach(function(k){ k.done = true; }); sel = null; draw(); } };
  };

  /* Mito o verdad */
  MODS.vf = function(r, c, host, api){
    var cards = shuffle(r.cards.map(function(x){ return { t: x.t, v: x.v, why: x.why }; }));
    var i = 0, answered = false, last = false;
    function draw(){
      var k = cards[i];
      var h = '<div class="vf-card">' + esc(k.t) + '</div>';
      if (!answered){
        h += '<div class="vf-btns"><button type="button" class="btn center" data-v="1">Verdad</button><button type="button" class="btn center" data-v="0">Mito</button></div>';
      } else {
        h += '<div class="vf-fb' + (last ? "" : " no") + '"><strong>' + (last ? "Correcto" : "Era " + (k.v ? "verdad" : "un mito")) + '</strong><p>' + esc(k.why) + '</p>' +
             '<button type="button" class="btn center" data-nx="1">' + (i === cards.length - 1 ? "Terminar" : "Siguiente afirmación") + '</button></div>';
      }
      host.innerHTML = h;
      api.status("Afirmación " + (i + 1) + " de " + cards.length);
    }
    draw();
    host.addEventListener("click", function(e){
      if (c.done) return;
      var v = e.target.closest("[data-v]"), nx = e.target.closest("[data-nx]");
      if (v && !answered){
        var k = cards[i];
        last = (v.getAttribute("data-v") === "1") === k.v;
        if (!last) api.err(); else sfx("found");
        answered = true;
        draw();
      } else if (nx && answered){
        answered = false;
        i++;
        if (i >= cards.length){
          host.innerHTML = '<div class="vf-card">Terminaste las ' + cards.length + ' afirmaciones.</div>';
          api.status("");
          api.finish();
        } else { draw(); }
      }
    });
    return {
      reveal: function(){
        host.innerHTML = '<ul class="review">' + cards.map(function(k){
          return "<li><b>" + (k.v ? "Verdad" : "Mito") + ":</b> " + esc(k.t) + "</li>";
        }).join("") + "</ul>";
      }
    };
  };

  /* Completar frases con banco de palabras */
  MODS.cloze = function(r, c, host, api){
    var blanks = [];
    r.parts.forEach(function(p){ if (typeof p !== "string") blanks.push(p.a); });
    var bank = shuffle(r.bank.map(function(t){ return { t: t, used: false }; }));
    var active = 0, flash = -1;
    function draw(){
      var bi = 0;
      var html = r.parts.map(function(p){
        if (typeof p === "string") return esc(p);
        var k = bi++;
        var cls = "blank" + (k < active ? " filled" : "") + (k === active ? " active" : "");
        return '<span class="' + cls + '">' + (k < active ? esc(blanks[k]) : "&nbsp;") + "</span>";
      }).join("");
      var chips = bank.map(function(b, i){
        return '<button type="button" class="chip-btn' + (flash === i ? " flash" : "") + '" data-i="' + i + '"' + (b.used ? " disabled" : "") + ">" + esc(b.t) + "</button>";
      }).join("");
      host.innerHTML = '<p class="cloze">' + html + '</p><p class="hint-msg">Toca la palabra que completa el espacio resaltado.</p><div class="bank">' + chips + "</div>";
    }
    api.status("0 de " + blanks.length + " espacios");
    draw();
    host.addEventListener("click", function(e){
      var b = e.target.closest("button[data-i]");
      if (!b || c.done) return;
      var i = Number(b.getAttribute("data-i"));
      if (bank[i].used) return;
      if (bank[i].t === blanks[active]){
        bank[i].used = true;
        active++;
        sfx("found");
        api.status(active + " de " + blanks.length + " espacios");
        draw();
        if (active === blanks.length) api.finish();
      } else {
        api.err();
        flash = i;
        draw();
        flash = -1;
      }
    });
    return { reveal: function(){ active = blanks.length; bank.forEach(function(b){ b.used = true; }); draw(); } };
  };

  /* Tocar el punto correcto del cuerpo */
  MODS.tapbody = function(r, c, host, api){
    var stage = 0, stageErr = 0, n = r.stages.length, busy = false, svg;
    host.innerHTML = '<div class="stagechip" id="chip"></div><div class="scene light" id="bodyHost"></div>';
    var bodyHost = host.querySelector("#bodyHost"), chip = host.querySelector("#chip");
    function zone(){ return svg.querySelector('[data-z="' + stage + '"]'); }
    function label(){ var g = svg.querySelector("#lbl" + stage); if (g) g.removeAttribute("hidden"); }
    function render(){
      bodyHost.innerHTML = bodySvg(stage);
      bodyHost.className = "scene light swap";
      svg = bodyHost.querySelector("#bodySvg");
      chip.textContent = "PASO " + (stage + 1) + " DE " + n + " · " + (stage ? "RCP · ACOSTADO BOCA ARRIBA" : "HEIMLICH · DE PIE");
      chip.className = "stagechip s" + stage;
      document.getElementById("q").textContent = r.stages[stage].q;
      api.status("Paso " + (stage + 1) + " de " + n + " · " + r.stages[stage].tag);
      svg.addEventListener("click", function(e){
        var zel = e.target.closest ? e.target.closest("[data-z]") : null;
        var z = zel ? Number(zel.getAttribute("data-z")) : null;
        if (!c.done && !busy && z !== stage) ripple(svg, e);
        hit(z);
      });
      svg.addEventListener("keydown", function(e){
        if ((e.key === "Enter" || e.key === " ") && e.target.getAttribute && e.target.getAttribute("data-z") !== null){
          e.preventDefault();
          hit(Number(e.target.getAttribute("data-z")));
        }
      });
    }
    function advance(){
      label();
      var doneMsg = r.stages[stage].done;
      stage++; stageErr = 0;
      if (stage >= n){
        stage = n - 1;
        api.status("");
        api.finish();
      } else {
        busy = true;
        if (doneMsg) api.stage(doneMsg);
        setTimeout(function(){ busy = false; if (!c.done) render(); }, 1500);
      }
    }
    function hit(z){
      if (c.done || busy) return;
      if (z !== null && z === stage){
        zone().classList.add("found");
        sfx("good");
        advance();
      } else {
        api.err();
        stageErr++;
        var base = "Paso " + (stage + 1) + " de " + n + " · " + r.stages[stage].tag + " · ";
        if (stageErr >= 3){
          api.status(base + "Se muestra la posición correcta.", "bad");
          zone().classList.add("found");
          advance();
        } else {
          api.status(base + "Ese no es el punto. Intento " + stageErr + " de 3.", "bad");
        }
      }
    }
    render();
    return {
      reveal: function(){ zone().classList.add("found"); label(); }
    };
  };

  /* Marcar el ritmo del RCP */
  MODS.tempo = function(r, c, host, api){
    var N = 12, taps = [], busy = false;
    host.innerHTML =
      '<button type="button" class="tap" id="tp">Toca aquí</button>' +
      '<div class="meter" aria-hidden="true"><div class="band"></div><div class="mk" id="mk" hidden></div></div>' +
      '<div class="meter-lab" aria-hidden="true"><span>60</span><span>100 a 120 por minuto</span><span>180</span></div>' +
      '<p class="tempo-out" id="out" aria-live="polite"></p>' +
      '<div class="tempo-actions"><button type="button" class="btn ghost" id="listen">Escuchar el ritmo</button><button type="button" class="btn ghost" id="again" hidden>Intentar otra vez</button></div>';
    var btn = host.querySelector("#tp"), out = host.querySelector("#out"), mk = host.querySelector("#mk");
    var again = host.querySelector("#again"), listen = host.querySelector("#listen");
    api.status("0 de " + N + " toques");
    function place(bpm){
      var pct = Math.max(0, Math.min(100, (bpm - 60) / 120 * 100));
      mk.style.left = pct + "%";
      mk.hidden = false;
    }
    function evaluate(){
      var iv = [];
      for (var i = 2; i < taps.length; i++) iv.push(taps[i] - taps[i - 1]);
      var avg = iv.reduce(function(a, b){ return a + b; }, 0) / iv.length;
      var bpm = Math.round(60000 / avg);
      place(bpm);
      if (bpm >= 100 && bpm <= 120){
        out.textContent = "Tu ritmo: " + bpm + " por minuto. Está dentro del rango.";
        btn.disabled = true;
        listen.hidden = true;
        api.finish();
      } else {
        api.err();
        var dir = bpm > 120 ? "Vas demasiado rápido." : "Vas demasiado lento.";
        if (c.errors >= 3){
          out.textContent = "Tu ritmo: " + bpm + " por minuto. " + dir + " El rango correcto es 100 a 120.";
          btn.disabled = true;
          listen.hidden = true;
          api.finish();
        } else {
          out.textContent = "Tu ritmo: " + bpm + " por minuto. " + dir + " Prueba de nuevo.";
          again.hidden = false;
          btn.disabled = true;
          busy = true;
        }
      }
    }
    btn.addEventListener("click", function(){
      if (c.done || busy) return;
      var now = performance.now();
      if (taps.length && now - taps[taps.length - 1] > 2000){ taps = []; out.textContent = "Se cortó el ritmo. Empieza de nuevo."; }
      taps.push(now);
      sfx("found");
      api.status(taps.length + " de " + N + " toques");
      if (taps.length >= N) evaluate();
    });
    again.addEventListener("click", function(){
      taps = []; busy = false;
      btn.disabled = false;
      again.hidden = true;
      mk.hidden = true;
      out.textContent = "";
      api.status("0 de " + N + " toques");
    });
    listen.addEventListener("click", function(){
      if (c.done) return;
      var k = 0;
      var iv = setInterval(function(){
        try { tone(900, 0, 0.06, "square", 0.12); } catch(e){}
        btn.classList.add("beat");
        setTimeout(function(){ btn.classList.remove("beat"); }, 110);
        k++;
        if (k >= 8) clearInterval(iv);
      }, 545);
    });
    return {
      reveal: function(){
        btn.disabled = true; listen.hidden = true; again.hidden = true;
        place(110);
        out.textContent = "El ritmo correcto es de 100 a 120 compresiones por minuto.";
      }
    };
  };

  /* ====================== RESULTADO ====================== */
  function finish(){
    if (S.over) return;
    S.over = true;
    S.timing = false;
    stopTicker();
    var n = S.list.length, first = 0;
    for (var i = 0; i < n; i++){ if (S.results[i] && S.results[i].first) first++; }
    var prev = null;
    for (var p = runsMem.length - 1; p >= 0; p--){
      if (runsMem[p].rec === S.rec){ prev = runsMem[p]; break; }
    }
    runsMem.push({ team: team, rec: S.rec, mode: S.mode, score: S.score, first: first, n: n, ts: Date.now() });
    saveRuns();
    renderBeats();
    updateHud();
    sfx("end");
    confetti(46);

    var cmp;
    if (prev){
      var dF = first - prev.first;
      var chipF = '<span class="delta ' + (dF > 0 ? "up" : dF < 0 ? "down" : "") + '">' + (dF > 0 ? "+" : "") + dF + "</span>";
      cmp = '<div class="compare"><p><b>Ronda anterior:</b> ' + prev.first + " de " + prev.n + " sin errores, " + prev.score + " pts" + (prev.mode === "clock" ? " (modo reloj)" : "") + ".</p>" +
            "<p><b>Esta ronda:</b> " + first + " de " + n + " sin errores " + chipF + "</p>";
      if (prev.mode === S.mode){
        var dS = S.score - prev.score;
        cmp += "<p>Puntaje: " + S.score + ' pts <span class="delta ' + (dS > 0 ? "up" : dS < 0 ? "down" : "") + '">' + (dS > 0 ? "+" : "") + dS + "</span></p>";
      }
      cmp += "</div>";
    } else {
      cmp = '<div class="compare"><p>Es la primera ronda guardada de este recorrido en este celular. Juega otra al final de la capacitación para comparar.</p></div>';
    }

    var byB = {}, order = [];
    S.list.forEach(function(r, k){
      if (!byB[r.b]){ byB[r.b] = { n: 0, ok: 0, pts: 0 }; order.push(r.b); }
      var o = byB[r.b], res = S.results[k];
      o.n++;
      if (res){ o.pts += res.pts; if (res.state === "ok") o.ok++; }
    });
    var blocks = order.map(function(id){
      var o = byB[id];
      return "<li><span>" + esc(BN[id]) + "</span><b>" + o.ok + " de " + o.n + " sin errores · " + o.pts + " pts</b></li>";
    }).join("");

    var rev = "";
    S.list.forEach(function(r, k){
      var res = S.results[k];
      if (!res || res.state !== "ok") rev += "<li>" + esc(r.repaso) + "</li>";
    });
    var revBlock = rev
      ? '<h2>Para repasar</h2><ul class="review">' + rev + "</ul>"
      : "<h2>Para repasar</h2><p>Todos los retos salieron sin errores.</p>";

    var modeLine = S.mode === "clock" ? "Modo reloj" : "Modo tranquilo";
    var recName = S.rec === "all" ? "Recorrido completo" : BN[S.rec];

    screen.innerHTML =
      '<section class="result">' +
        '<p class="tag">Resultado' + (team ? " · " + esc(team) : "") + "</p>" +
        '<p class="success">' + (S.rec === "all" ? "¡Recorrido completo terminado!" : "¡Bloque terminado!") + " Sumaste " + S.score + " puntos.</p>" +
        '<p class="big" id="res-h" tabindex="-1">' + S.score + "<small>pts</small></p>" +
        '<ul class="stats"><li><b>' + first + " de " + n + "</b> retos sin errores</li><li>" + esc(recName) + " · " + modeLine + "</li></ul>" +
        cmp +
        '<h2>Por bloque</h2><ul class="blocks">' + blocks + "</ul>" +
        revBlock +
        '<div class="actions">' +
          '<button class="btn center" id="again" type="button">Jugar otra vez</button>' +
          '<button class="btn ghost" id="home" type="button">Volver al inicio</button>' +
        "</div>" +
      "</section>";
    window.scrollTo(0, 0);
    document.getElementById("res-h").focus({ preventScroll: true });
  }

  /* ====================== EVENTOS GLOBALES ====================== */
  document.addEventListener("click", function(e){
    var rb = e.target.closest ? e.target.closest("[data-rec]") : null;
    if (rb && !S){
      rec = rb.getAttribute("data-rec");
      document.querySelectorAll("#recs .rec").forEach(function(x){
        x.setAttribute("aria-pressed", x.getAttribute("data-rec") === rec ? "true" : "false");
      });
      return;
    }
    var b = e.target.closest ? e.target.closest("button") : null;
    if (!b) return;
    try { if (!audioCtx) actx(); } catch(err){}
    var id = b.id;
    if (b.getAttribute("data-home") !== null || id === "home-top"){ askHome(); }
    else if (id === "home-yes"){ goHome(); }
    else if (id === "home-no"){ keepPlaying(); }
    else if (id === "peek"){ peek(); }
    else if (id === "reopen"){ openFb(); }
    else if (id === "next"){ next(); }
    else if (id === "m-calm"){ start("calm"); }
    else if (id === "m-clock"){ start("clock"); }
    else if (id === "how"){ showHow(); }
    else if (id === "how-close"){ closeHow(); }
    else if (id === "snd"){ soundOn = !soundOn; b.textContent = "Sonido: " + (soundOn ? "sí" : "no"); }
    else if (id === "clear"){ runsMem = []; try { localStorage.removeItem(LS_KEY); } catch(err){} showStart(); }
    else if (id === "again" && S && S.over){ start(S.mode); }
    else if (id === "home"){ goHome(); }
  });
  document.addEventListener("keydown", function(e){
    if (e.key !== "Escape") return;
    if (document.getElementById("homemodal")) keepPlaying();
    else if (document.getElementById("fbmodal")) peek();
    else closeHow();
  });

  function boot(){ showStart(); }
  if (window.claude && window.claude.hot && window.claude.hot.ready){
    if (window.claude.hot.snapshot) window.claude.hot.snapshot(function(){ return {}; });
    window.claude.hot.ready(boot);
  } else {
    boot();
  }

  window.__reto = { get S(){ return S; }, RETOS: RETOS };
})();
</script>
